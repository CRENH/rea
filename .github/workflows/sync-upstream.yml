name: Sync Upstream

on:
  schedule:
    # 每天 UTC 0 点执行一次（北京时间早上 8 点）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    # 只有仓库所有者才能触发（防止别人乱触发）
    if: github.repository_owner == github.actor || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须拉取所有历史，才能正确 merge
          fetch-depth: 0
          # 使用 PAT 才能 push（后面会说怎么生成）
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/morluto/rea.git
          git fetch upstream

      - name: Merge upstream into current branch
        run: |
          # 默认同步 main 分支，如果是 master 改成 master
          git checkout main
          git merge upstream/main --no-edit || {
            echo "Merge conflict detected"
            exit 1
          }

      - name: Push changes
        run: |
          git push origin main
